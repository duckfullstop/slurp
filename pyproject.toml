[project]
name = "slurp"
version = "2026.9.1"
description = "Online media ingest utility"
authors = [
    { name = "embr", email = "git@liclac.eu" },
    { name = "duck.", email = "me@duck.moe" },
    { name = "Wren Wood", email = "wren@beforetree.com" }
]
requires-python = ">=3.13"
readme = "README.md"
license = { text = "EUPL-1.2" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "flask (>=3.1.0,<4.0.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "flask-wtf (>=1.2.2,<2.0.0)",
    "yt-dlp (>=2026.8.19)",
    "httpx (>=0.28.1,<0.29.0)",
    "gunicorn (~=26.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "coverage>=7.16.1,<8.0.0",
    "yt-dlp-ejs(~=0.8)",
    "pymediainfo (>=7.0.1,<8.0.0)",
    "pydantic (~=2.13)",
    "flask-restx (~=1.3)",
    "celery[redis]~=5.6",
    "flower==2.2.0",
    "flask-redis>=0.4.0",
    "redis-om>=1.1.0",
    "flask-sse>=1.0.0",
    "flask-vite>=0.6.1",
]

[project.scripts]
serve = "slurp:serve"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "coverage (>=7.13.1,<8.0.0)",
    "ruff >=0.16.3",
    "celery-types>=0.26.0"
]

[tool.ruff.lint]
# https://astral.sh/blog/ruff-v0.16.0 Fix me if you like / dare
select = ["E4", "E7", "E9", "F"]

[tool.uv.build-backend]
module-name = "slurp"
namespace = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[pytest]
tmp_path_retention_policy = "none"
