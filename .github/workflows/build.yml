name: Build

permissions:
  id-token: write
  contents: read
  attestations: write
  packages: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  cri:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      build-args: |
        NODE_ENV=${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'development' }}
      file: ./Containerfile
      meta-images: ghcr.io/${{ github.repository }}
      meta-labels: |
        org.opencontainers.image.title=Slurp
        org.opencontainers.image.description=Web media ingest utility.
        org.opencontainers.image.url=https://github.com/duckfullstop/slurp
        org.opencontainers.image.source=https://github.com/duckfullstop/slurp
        org.opencontainers.image.vendor=duckfullstop
      meta-tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=semver,pattern={{version}}
        type=sha,format=long
      output: image
      platforms: linux/amd64,linux/arm64
      push: ${{ github.event_name != 'pull_request' }}
      sbom: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}