name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Install a specific version of uv.
          version: "0.9.22"
      - name: Display versions
        run: |
          python -c "import sys; print(sys.version)"
          uv --version
      - uses: actions/cache@v3
        name: Cache venv
        with:
          path: ./.venv
          key: test-venv-${{ hashFiles('uv.lock') }}
      - name: Install the project dependencies
        run: uv sync --locked --all-extras --dev

      # Do we want to make tests not require redis in future?
      - name: Start Redis
        uses: supercharge/redis-github-action@1.8.1
        with:
          redis-version: "7.4"

      - name: Run tests
        run: uv run pytest -v -m 'not dl'

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: frontend
          runtime: node@26
          cache: true
      - name: Run lint
        run: pnpm run lint

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: frontend
          runtime: node@26
          cache: true
      - name: Build (generate auto-import type declarations)
        run: pnpm run build
      - name: Run typecheck
        run: pnpm run typecheck

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: frontend
          runtime: node@26
          cache: true
      - name: Run build
        run: pnpm run build
