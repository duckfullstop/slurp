<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta content="#ffffff" name="theme-color"/>
  <title>Slurp</title>
  <meta
    content="The web media utility built with the broadcast domain in mind."
    name="description">
  <meta content="Slurp" property="og:title">
  <meta
    content="The web media utility built with the broadcast domain in mind."
    property="og:description">
  <meta content="summary_large_image" name="twitter:card">
  <style>html {
    background-color: #ffffff
  }

  html.dark {
    background-color: #18181b
  }</style>
  <script>
    (function () {
      var mode = localStorage.getItem('vueuse-color-scheme') || 'auto'
      var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
      if (dark) {
        document.documentElement.classList.add('dark')
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#18181b')
      }
    })()
  </script>
</head>

<body>
<div id="app" class="isolate"></div>
<script src="/src/main.ts" type="module"></script>
</body>

</html>
